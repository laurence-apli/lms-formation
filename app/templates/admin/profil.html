{% extends "admin/base.html" %}
{% block titre %}Mon profil — Administration{% endblock %}
{% block contenu %}
<div class="topbar"><div><h1>Mon profil</h1></div></div>
<div class="fiche-eleve-header-profil" style="max-width:560px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:22px;">
  <div style="display:flex; gap:24px; align-items:flex-start; margin-bottom:18px;">
    <div style="text-align:center;">
      <div id="zone-photo" style="width:90px; height:90px; border-radius:50%; background:var(--cream); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
        <span style="font-size:28px; color:var(--grey);">🪪</span>
      </div>
      <label for="input-photo" style="font-size:11px; color:var(--gold); text-decoration:underline; cursor:pointer;">Changer la photo</label>
      <input type="file" id="input-photo" accept="image/*" style="display:none;" onchange="chargerImage(this.files, 'photo')">
    </div>
    <div style="text-align:center;">
      <div id="zone-logo" style="width:90px; height:90px; border-radius:10px; background:var(--cream); border:1px solid var(--border); overflow:hidden; display:flex; align-items:center; justify-content:center; margin-bottom:8px;">
        <span style="font-size:28px; color:var(--grey);">🏷️</span>
      </div>
      <label for="input-logo" style="font-size:11px; color:var(--gold); text-decoration:underline; cursor:pointer;">Changer le logo</label>
      <input type="file" id="input-logo" accept="image/*" style="display:none;" onchange="chargerImage(this.files, 'logo')">
    </div>
  </div>

  <div id="zone-erreur"></div>
  <label style="display:block; font-size:12px; color:var(--grey); font-weight:600; margin:14px 0 4px;">Prénom</label>
  <input type="text" id="profil-prenom" style="display:block; width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">
  <label style="display:block; font-size:12px; color:var(--grey); font-weight:600; margin:14px 0 4px;">Nom</label>
  <input type="text" id="profil-nom" style="display:block; width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">
  <label style="display:block; font-size:12px; color:var(--grey); font-weight:600; margin:14px 0 4px;">E-mail</label>
  <input type="email" id="profil-email" style="display:block; width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">
  <label style="display:block; font-size:12px; color:var(--grey); font-weight:600; margin:14px 0 4px;">Téléphone</label>
  <input type="tel" id="profil-telephone" style="display:block; width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:14px;">

  <div style="margin-top:24px; padding-top:20px; border-top:1px solid var(--border);">
    <label style="display:block; font-size:12px; color:var(--grey); font-weight:600; margin-bottom:4px;">🔗 Lien vers le dépôt technique (GitHub)</label>
    <div style="display:flex; gap:8px;">
      <input type="text" id="profil-lien-github" placeholder="https://github.com/…" style="flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px;">
      <a class="btn btn-sm" id="lien-ouvrir-github" href="#" target="_blank" rel="noopener" style="display:none;">Ouvrir ↗</a>
    </div>
  </div>

  <div class="modal-actions" style="justify-content:flex-start; margin-top:16px;">
    <button class="btn btn-primary" onclick="enregistrer()">Enregistrer</button>
  </div>
</div>

{% endblock %}
{% block scripts %}
<script>
async function charger() {
  const p = await appelApi('/admin/profil');
  document.getElementById('profil-prenom').value = p.prenom || '';
  document.getElementById('profil-nom').value = p.nom || '';
  document.getElementById('profil-email').value = p.email || '';
  document.getElementById('profil-telephone').value = p.telephone || '';
  document.getElementById('profil-lien-github').value = p.lien_github || '';
  if (p.lien_github) {
    const lien = document.getElementById('lien-ouvrir-github');
    lien.href = p.lien_github;
    lien.style.display = 'inline-flex';
  }
  if (p.photo_url) document.getElementById('zone-photo').innerHTML = `<img src="${p.photo_url}" style="width:100%;height:100%;object-fit:cover;">`;
  if (p.logo_url) document.getElementById('zone-logo').innerHTML = `<img src="${p.logo_url}" style="width:100%;height:100%;object-fit:contain;">`;
}

function chargerImage(files, type) {
  if (!files || files.length === 0) return;
  const fichier = files[0];
  if (!fichier.type.startsWith('image/')) { afficherToast("Ce fichier n'est pas une image"); return; }
  const reader = new FileReader();
  reader.onload = async (e) => {
    const dataUrl = e.target.result;
    const zone = document.getElementById(type === 'photo' ? 'zone-photo' : 'zone-logo');
    zone.innerHTML = `<img src="${dataUrl}" style="width:100%;height:100%;object-fit:${type === 'photo' ? 'cover' : 'contain'};">`;
    const data = new FormData();
    data.append('url', dataUrl);
    await appelApi(`/admin/profil/${type}`, { method: 'PUT', body: data });
    afficherToast(type === 'photo' ? 'Photo mise à jour' : 'Logo mis à jour');
  };
  reader.readAsDataURL(fichier);
}

async function enregistrer() {
  const data = new FormData();
  data.append('prenom', document.getElementById('profil-prenom').value);
  data.append('nom', document.getElementById('profil-nom').value);
  data.append('email', document.getElementById('profil-email').value);
  data.append('telephone', document.getElementById('profil-telephone').value);
  data.append('lien_github', document.getElementById('profil-lien-github').value);
  try {
    await appelApi('/admin/profil', { method: 'PUT', body: data });
    afficherToast('Profil enregistré');
    await charger();
  } catch (e) {
    document.getElementById('zone-erreur').innerHTML = '<div class="message-erreur">' + e.message + '</div>';
  }
}

charger();
</script>
{% endblock %}
