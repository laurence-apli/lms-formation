<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Choisir mes formations — Laurence Mermet-Bijon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --or:#B8922A; --or-lt:#F5EDD6; --sable:#EDE4D4; --sable-lt:#F7F3EC; --sable-dk:#C9B89A;
  --profond:#2E2210; --rose:#C47B6E; --rose-lt:#FAF0EE; --creme:#FDFAF5; --doux:#7A6A56; --leger:#B0A090;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
* { box-sizing:border-box; }
body { margin:0; font-family:var(--sans); background:var(--creme); color:var(--profond); }
.topbar { background:var(--profond); color:var(--creme); padding:20px 40px; font-family:var(--serif); font-size:20px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.topbar a.retour { font-family:var(--sans); font-size:12.5px; color:var(--creme); text-decoration:none; border:1px solid rgba(253,250,245,.3); border-radius:20px; padding:7px 16px; white-space:nowrap; }
.topbar a.retour:hover { border-color:var(--or); color:var(--or); }
.wrap { max-width:1180px; margin:0 auto; padding:36px 28px 80px; display:grid; grid-template-columns:1fr 360px; gap:32px; align-items:start; }
h1 { font-family:var(--serif); font-weight:300; font-size:32px; margin:0 0 6px; }
.sous-titre { color:var(--doux); font-size:14px; margin-bottom:20px; }

.bloc-montee { background:var(--rose-lt); border:1px solid var(--rose); border-radius:10px; padding:16px 20px; margin-bottom:20px; cursor:pointer; }
.bloc-montee-row { display:flex; align-items:flex-start; gap:12px; }
.bloc-montee h3 { font-family:var(--serif); font-size:16px; margin:0 0 6px; }
.bloc-montee p { font-size:13px; color:var(--doux); margin:0; }
.bloc-montee .f-check { border-color:var(--rose); }
.bloc-montee .f-check.checked { background:var(--rose); border-color:var(--rose); }

.formation-bloc { background:#fff; border:1px solid var(--sable-dk); border-radius:12px; padding:22px 24px; margin-bottom:16px; }
.f-row { display:flex; align-items:flex-start; gap:14px; }
.f-visuel { width:64px; height:64px; border-radius:8px; overflow:hidden; flex-shrink:0; background:var(--sable-lt); }
.f-visuel img { width:100%; height:100%; object-fit:cover; }
.f-check { width:22px; height:22px; border:2px solid var(--sable-dk); border-radius:6px; flex-shrink:0; margin-top:2px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.f-check.checked { background:var(--or); border-color:var(--or); color:#fff; font-size:13px; font-weight:700; }
.f-titre { font-family:var(--serif); font-size:20px; font-weight:600; margin:0 0 4px; }
.f-desc-courte { font-size:12.5px; color:var(--doux); line-height:1.55; margin:6px 0; }
.f-prix { display:flex; align-items:baseline; gap:10px; margin-top:8px; }
.f-final { font-family:var(--serif); font-size:20px; font-weight:600; }
.prix-barre { text-decoration:line-through; color:var(--leger); font-size:14px; font-weight:400; }
.opt-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--sable-dk); border-radius:8px; cursor:pointer; margin-top:8px; }
.opt-row.selected { border-color:var(--or); background:var(--or-lt); }
  .niveaux-liste { margin-top:14px; } .niveau-row.opt-row { border:none; border-radius:10px; padding:10px 12px; margin-top:0; align-items:flex-start; } .niveau-row.opt-row.selected { background:var(--or-lt); } .niveau-marqueur { display:flex; flex-direction:column; align-items:center; flex-shrink:0; } .niveau-point { width:24px; height:24px; border-radius:50%; border:2px solid var(--sable-dk); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:600; color:var(--doux); background:#fff; flex-shrink:0; } .niveau-row.opt-row.selected .niveau-point { background:var(--or); border-color:var(--or); color:#fff; } .niveau-trait { width:2px; flex:1; min-height:18px; background:var(--sable-dk); margin-top:2px; } .niveau-contenu { flex:1; padding-bottom:4px; } .niveau-entete { display:flex; justify-content:space-between; align-items:baseline; gap:10px; } .niveau-nom { font-family:var(--serif); font-size:16px; font-weight:600; } .niveau-row.opt-row.selected .niveau-nom { color:var(--or); } .niveau-prix { font-family:var(--serif); font-size:16px; font-weight:600; white-space:nowrap; } .niveau-detail { font-size:12px; color:var(--doux); margin:3px 0 0; line-height:1.5; }

.recap { position:sticky; top:28px; background:#fff; border:1px solid var(--sable-dk); border-radius:14px; padding:26px 24px; }
.recap h2 { font-family:var(--serif); font-weight:600; font-size:19px; margin:0 0 16px; }
.recap-item { display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:9px; padding-bottom:9px; border-bottom:1px solid var(--sable-lt); }
.recap-total { display:flex; justify-content:space-between; align-items:baseline; padding-top:14px; border-top:2px solid var(--profond); margin-top:6px; }
.recap-total .val { font-family:var(--serif); font-size:28px; font-weight:600; color:var(--or); }
.btn-payer { width:100%; margin-top:20px; background:var(--or); color:#fff; border:none; border-radius:30px; padding:14px; font-size:14px; font-weight:600; text-transform:uppercase; cursor:pointer; }
.promo-input-row { display:flex; gap:8px; margin-top:10px; }
.promo-input-row input { flex:1; padding:9px 12px; border:1px solid var(--sable-dk); border-radius:8px; }
.promo-input-row button { background:var(--profond); color:var(--creme); border:none; border-radius:8px; padding:9px 16px; cursor:pointer; }
</style>
</head>
<body>

<div class="topbar">
  <span>Formation proposée par Laurence Mermet-Bijon</span>
  <a class="retour" href="/eleve/tableau-de-bord">← Retour à mon espace</a>
</div>

<div class="wrap">
  <div>
    <h1>Choisis tes formations</h1>
    <p class="sous-titre">Sélectionne une ou plusieurs formations — le récapitulatif se met à jour à droite.</p>
    <div id="zone-montees"></div>
    <div id="zone-formations">Chargement…</div>
  </div>
  <div class="recap">
    <h2>Récapitulatif</h2>
    <div id="recap-contenu"><p style="color:var(--leger);font-size:13px">Sélectionne une formation pour commencer</p></div>
  </div>
</div>

<script>
let catalogue = [];
let selection = {}; // tarif_id -> {nom, prix, montee?}
let codeApplique = null;

async function chargerTout() {
  const [cat, montees, tableauDeBord] = await Promise.all([
    fetch('/public/catalogue').then(r => r.json()),
    fetch('/eleve/montees-de-niveau').then(r => r.ok ? r.json() : []).catch(() => []),
    fetch('/api/eleve/tableau-de-bord').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  catalogue = cat;

  // Formations déjà possédées (même partiellement, ex. niveau 1 sur 3) :
  // on ne les propose plus dans le catalogue général -- la seule façon de
  // les faire progresser est le bloc "Monter de niveau" ci-dessus, qui
  // calcule la vraie différence à payer plutôt que le prix plein.
  const idsDejaAcquis = new Set(
    ((tableauDeBord && tableauDeBord.formations_acquises) || []).map(f => f.id)
  );

  document.getElementById('zone-montees').innerHTML = montees.map(m => `
    <div class="bloc-montee" id="montee-${m.tarif_id}" onclick="toggleMontee(${m.tarif_id}, '${m.formation_titre.replace(/'/g, "\\'")} — ${m.nom_option.replace(/'/g, "\\'")}', ${m.difference_a_payer})">
      <div class="bloc-montee-row">
        <div class="f-check" id="check-montee-${m.tarif_id}"></div>
        <div>
          <h3>Aller plus loin dans "${m.formation_titre}"</h3>
          <p>Passe au niveau "${m.nom_option}" pour seulement ${m.difference_a_payer} € de plus (au lieu du prix plein).</p>
        </div>
      </div>
    </div>
  `).join('');

  const formationsAProposer = catalogue.filter(f => !idsDejaAcquis.has(f.id));
  const formationsAcquises = catalogue.filter(f => idsDejaAcquis.has(f.id));
  const htmlAcquises = formationsAcquises.length ? formationsAcquises.map(f => `<div class="formation-achetee"><p class="f-titre">${f.titre}</p><a href="/eleve/formation/${f.id}" class="btn-acceder">Accéder à ma formation →</a></div>`).join('') : '';

  if (formationsAProposer.length === 0) {
    document.getElementById('zone-formations').innerHTML = htmlAcquises + (montees.length
      ? ''
      : '<p style="color:var(--leger);font-size:13px">Tu as déjà accès à toutes les formations disponibles pour le moment.</p>');
  } else {
    document.getElementById('zone-formations').innerHTML = htmlAcquises + formationsAProposer.map(f => {
      if (f.tarifs.length === 1) {
        const t = f.tarifs[0];
        return `
        <div class="formation-bloc" onclick="toggleSimple(${t.id}, '${f.titre.replace(/'/g, "\\'")}', ${t.prix_final})">
          <div class="f-row">
            <div class="f-visuel">${f.image_url ? `<img src="${f.image_url}">` : ''}</div>
            <div class="f-check" id="check-${t.id}"></div>
            <div>
              <p class="f-titre">${f.titre}</p>
              <p class="f-desc-courte">${f.description_courte || ''}</p>
              <div class="f-prix">${t.en_promo ? `<span class="prix-barre">${t.prix} €</span>` : ''}<span class="f-final">${t.prix_final} €</span></div>
            </div>
          </div>
        </div>`;
      } else {
        var imgHtml = f.image_url ? '<img src="' + f.image_url + '">' : '';
        var niveauxHtml = '';
        for (var i = 0; i < f.tarifs.length; i++) {
          var t = f.tarifs[i];
          var trait = i < f.tarifs.length - 1 ? '<span class="niveau-trait"></span>' : '';
          var promo = t.en_promo ? '<span class="prix-barre">' + t.prix + ' €</span> ' : '';
          var detail = t.contenu_ajoute ? '<p class="niveau-detail">' + t.contenu_ajoute + '</p>' : '';
          niveauxHtml += '<div class="niveau-row opt-row" id="opt-' + t.id + '" data-formation="' + f.titre.replace(/"/g, '&quot;') + '" data-tarif="' + id + '" data-niveau="' + t.nom_option.replace(/"/g, '&quot;') + '" data-prix="' + t.prix_final + '" onclick="choisirOption(this.dataset.formation, parseInt(this.dataset.tarif), this.dataset.niveau, parseFloat(this.dataset.prix))">';
          niveauxHtml += '<div class="niveau-marqueur"><span class="niveau-point">' + (i + 1) + '</span>' + trait + '</div>';
          niveauxHtml += '<div class="niveau-contenu"><div class="niveau-entete"><span class="niveau-nom">' + t.nom_option + '</span><span class="niveau-prix">' + promo + t.prix_final + ' €</span></div>' + detail + '</div></div>';
        }
        return '<div class="formation-bloc"><div class="f-row"><div class="f-visuel">' + imgHtml + '</div><div style="flex:1"><p class="f-titre">' + f.titre + '</p><p class="f-desc-courte">' + (f.description_courte || '') + ' Choisis le niveau qui te correspond.</p></div></div><div class="niveaux-liste">' + niveauxHtml + '</div></div>';
            }
    }).join('');
  }
}
function toggleSimple(tarifId, nom, prix) {
  const check = document.getElementById(`check-${tarifId}`);
  if (selection[tarifId] && !selection[tarifId].montee) {
    delete selection[tarifId];
    check.classList.remove('checked'); check.innerHTML = '';
  } else {
    selection[tarifId] = { nom, prix };
    check.classList.add('checked'); check.innerHTML = '✓';
  }
  majRecap();
}

function toggleMontee(tarifId, nom, prix) {
  const check = document.getElementById(`check-montee-${tarifId}`);
  if (selection[tarifId] && selection[tarifId].montee) {
    delete selection[tarifId];
    check.classList.remove('checked'); check.innerHTML = '';
  } else {
    selection[tarifId] = { nom, prix, montee: true };
    check.classList.add('checked'); check.innerHTML = '✓';
  }
  majRecap();
}

function choisirOption(formationTitre, tarifId, nomOption, prix) {
  // Retire les autres options de la même formation (non cumulables) --
  // comparaison via data-formation, posé sur chaque ligne au rendu.
  document.querySelectorAll(`[id^="opt-"]`).forEach(el => {
    if (el.dataset.formation === formationTitre) el.classList.remove('selected');
  });
  Object.keys(selection).forEach(id => {
    if (selection[id].formationTitre === formationTitre) delete selection[id];
  });
  document.getElementById(`opt-${tarifId}`).classList.add('selected');
  selection[tarifId] = { nom: `${formationTitre} — ${nomOption}`, prix, formationTitre };
  majRecap();
}

async function majRecap() {
  const cles = Object.keys(selection);
  const zone = document.getElementById('recap-contenu');
  if (cles.length === 0) {
    zone.innerHTML = '<p style="color:var(--leger);font-size:13px">Sélectionne une formation pour commencer</p>';
    return;
  }

  const tarifIds = cles.filter(id => !selection[id].montee).map(Number);
  const monteeIds = cles.filter(id => selection[id].montee).map(Number);

  const apercu = await fetch('/eleve/panier/apercu', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tarif_ids: tarifIds, montee_tarif_ids: monteeIds, code_promo: codeApplique }),
  }).then(r => r.json());

  let html = apercu.lignes.map(l => `
    <div class="recap-item"><span>${l.nom}</span><span>${l.prix_final} €</span></div>
  `).join('');

  html += `<div class="promo-input-row">
    <input type="text" id="code-input" placeholder="Code promo">
    <button onclick="appliquerCode()">OK</button>
  </div>`;
  if (apercu.erreur_code) html += `<p style="color:var(--rose);font-size:12px;margin-top:6px">${apercu.erreur_code}</p>`;

  html += `<div class="recap-total"><span>Total</span><span class="val">${apercu.total} €</span></div>`;
  html += `<button class="btn-payer" onclick="payer(${JSON.stringify(tarifIds)}, ${JSON.stringify(monteeIds)})">Passer au paiement</button>`;
  zone.innerHTML = html;
}

function appliquerCode() {
  codeApplique = document.getElementById('code-input').value;
  majRecap();
}

async function payer(tarifIds, monteeIds) {
  const resp = await fetch('/eleve/panier/paiement', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ tarif_ids: tarifIds, montee_tarif_ids: monteeIds, code_promo: codeApplique }),
  });
  if (resp.ok) {
    const data = await resp.json();
    window.location.href = data.checkout_url;
  } else {
    const erreur = await resp.json();
    alert(erreur.detail || "Une erreur est survenue.");
  }
}

chargerTout();
</script>
</body>
</html>
