{% extends "eleve/base.html" %}
{% block titre %}Connexion — Mon espace formation{% endblock %}
{% block contenu %}
<style>
  .login-screen { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; }
  .login-box { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:40px; width:380px; box-shadow:0 10px 40px rgba(0,0,0,0.06); }
  .login-box .brand-title { font-family:'EB Garamond',serif; font-size:22px; font-weight:600; text-align:center; margin-bottom:4px; }
  .login-box .brand-sub { font-family:'League Spartan',sans-serif; font-size:11px; letter-spacing:.06em; color:var(--gold); text-align:center; margin-bottom:28px; }
  .login-box label { font-size:12px; color:var(--grey); font-weight:600; display:block; margin:14px 0 5px; }
  .login-box input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:7px; font-size:14px; font-family:inherit; box-sizing:border-box; }
  .login-box input:focus { outline:none; border-color:var(--gold); }

  .btn-login {
    width:100%; margin-top:22px; padding:12px;
    background:var(--ink); color:#F5EDD6;
    border:none; border-radius:7px;
    font-family:'League Spartan',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; transition:background .2s, opacity .2s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .btn-login:hover:not(:disabled) { background:#45341a; }
  .btn-login:disabled { opacity:0.7; cursor:not-allowed; }

  .spinner {
    width:16px; height:16px;
    border:2px solid rgba(245,237,214,0.3);
    border-top-color:#F5EDD6;
    border-radius:50%;
    animation:spin .7s linear infinite;
    display:none;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  .login-box .lien-secondaire { display:block; text-align:center; margin-top:16px; font-size:12px; color:var(--gold); cursor:pointer; text-decoration:underline; }
  .message-erreur { background:#FBEAF0; border:1px solid #ED93B1; color:#72243E; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
  .message-info { background:#F5F0E8; border:1px solid #DDD0AE; color:#6B5A3C; border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; }
</style>

<div class="login-screen">
  <div class="login-box">
    <div class="brand-title">Mon espace formation</div>
    <div class="brand-sub">ESPACE PERSONNEL</div>

    <div id="zone-erreur"></div>

    <form id="form-connexion">
      <label>E-mail</label>
      <input type="email" id="email" name="email" required autocomplete="email">
      <label>Mot de passe</label>
      <input type="password" id="mot_de_passe" name="mot_de_passe" required autocomplete="current-password">
      <button type="submit" class="btn-login" id="btn-connexion">
        <span class="spinner" id="spinner"></span>
        <span id="btn-texte">Se connecter</span>
      </button>
    </form>
    <span class="lien-secondaire" onclick="afficherFormulaireOubli()">Mot de passe oublié ?</span>

    <form id="form-oubli" style="display:none;">
      <label>Votre e-mail</label>
      <input type="email" id="email_oubli" name="email" required>
      <button type="submit" class="btn-login">Recevoir un lien de réinitialisation</button>
      <span class="lien-secondaire" onclick="annulerOubli()">Retour à la connexion</span>
    </form>
  </div>
</div>

<script>
function afficherErreur(message) {
  document.getElementById('zone-erreur').innerHTML = '<div class="message-erreur">' + message + '</div>';
}
function afficherInfo(message) {
  document.getElementById('zone-erreur').innerHTML = '<div class="message-info">' + message + '</div>';
}

function setBoutonChargement(actif) {
  const btn = document.getElementById('btn-connexion');
  const spinner = document.getElementById('spinner');
  const texte = document.getElementById('btn-texte');
  if (actif) {
    btn.disabled = true;
    spinner.style.display = 'block';
    texte.textContent = 'Connexion en cours…';
  } else {
    btn.disabled = false;
    spinner.style.display = 'none';
    texte.textContent = 'Se connecter';
  }
}

document.getElementById('form-connexion').addEventListener('submit', async function(e) {
  e.preventDefault();
  document.getElementById('zone-erreur').innerHTML = '';
  setBoutonChargement(true);

  try {
    const data = new FormData(e.target);
    const resp = await fetch('/eleve/connexion', {
      method: 'POST',
      body: data,
      redirect: 'follow'
    });

    if (resp.redirected) {
      afficherInfo('Connexion réussie, redirection…');
      window.location.href = resp.url;
      return;
    }

    if (resp.ok) {
      // Connexion OK mais pas de redirection explicite — on redirige manuellement
      afficherInfo('Connexion réussie, redirection…');
      window.location.href = '/eleve/tableau-de-bord';
      return;
    }

    // Erreur serveur
    let message = "Identifiants incorrects. Vérifiez votre e-mail et mot de passe.";
    try {
      const erreur = await resp.json();
      if (erreur.detail) message = erreur.detail;
    } catch (_) {}
    afficherErreur(message);

  } catch (err) {
    afficherErreur("Impossible de contacter le serveur. Veuillez réessayer dans quelques secondes.");
  } finally {
    setBoutonChargement(false);
  }
});

function afficherFormulaireOubli() {
  document.getElementById('form-connexion').style.display = 'none';
  document.getElementById('form-oubli').style.display = 'block';
  document.getElementById('zone-erreur').innerHTML = '';
}
function annulerOubli() {
  document.getElementById('form-oubli').style.display = 'none';
  document.getElementById('form-connexion').style.display = 'block';
}

document.getElementById('form-oubli').addEventListener('submit', async function(e) {
  e.preventDefault();
  const data = new FormData(e.target);
  await fetch('/eleve/mot-de-passe-oublie', { method: 'POST', body: data });
 document.getElementById('form-oubli').innerHTML =
  '<p style="font-size:13px; text-align:center; color:var(--ink); margin-top:16px;">Si cette adresse existe dans notre système, un e-mail vient de vous être envoyé avec un lien pour réinitialiser votre mot de passe.</p>' +
  '<p style="font-size:12px; text-align:center; color:var(--ink); opacity:0.7; margin-top:8px;">Pensez à vérifier vos e-mails indésirables (spams) si vous ne le voyez pas arriver.</p>' +
  '<p style="text-align:center; margin-top:20px;"><a href="#" onclick="annulerOubli(); return false;" style="font-size:13px; color:var(--or, #B8922A); text-decoration:underline; cursor:pointer;">← Retour à la connexion</a></p>';
});
</script>
{% endblock %}
